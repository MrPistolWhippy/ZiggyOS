<!DOCTYPE html><html><head><title>CAPSULE CORP SCOUTER OVERRIDE</title>
<style>
body { background:#000; color:#ff3333; font-family:'Courier New',monospace; padding:20px; }
.grid-960 { max-width:960px; margin:0 auto; display:grid; grid-template-columns:1fr; gap:20px; }
@media(min-width:768px){.grid-960{grid-template-columns:2fr 1fr;}}
.card { border:2px solid #ff3333; padding:15px; background:#0d0202; box-shadow:0 0 15px rgba(255,51,51,0.3); }
.full-width { grid-column:1/-1; }
h2 { color:#ff3333; margin-top:0; text-transform:uppercase; font-size:1.2em; text-shadow:0 0 8px #ff3333; }
pre { white-space:pre-wrap; word-wrap:break-word; color:#ff6666; font-size:0.9em; line-height:1.4; max-height:350px; overflow-y:auto; }
.status-bar { display:flex; justify-content:space-between; border-bottom:1px solid #ff3333; padding-bottom:5px; margin-bottom:15px; font-size:0.8em; }
.btn-panel { display:flex; gap:15px; margin-bottom:15px; }
.cyber-btn { background:#000; color:#ff3333; border:1px solid #ff3333; padding:10px 15px; font-family:'Courier New',monospace; cursor:pointer; font-weight:bold; text-transform:uppercase; transition:all 0.2s; }
.cyber-btn:hover { background:#ff3333; color:#000; box-shadow:0 0 15px #ff3333; }
.chart-box { display:flex; flex-direction:column; align-items:center; justify-content:center; height:100%; min-height:220px; }
.metric-text { font-size:1.1em; font-weight:bold; margin-top:10px; text-shadow:0 0 5px #ff3333; }
</style>
<script>
async function fetchMetrics() {
    try {
        const resStatus = await fetch('/api/status');
        const dataStatus = await resStatus.json();
        document.getElementById('matrix-seed').innerText = dataStatus.ki_entropy_seed;
        document.getElementById('sys-time').innerText = dataStatus.timestamp;
        const used = parseFloat(dataStatus.disk_metrics.used);
        const total = parseFloat(dataStatus.disk_metrics.total);
        document.getElementById('disk-label').innerText = dataStatus.disk_metrics.raw_string + " Energy Expended";
        renderScouterChart(used, total);
        const resLogs = await fetch('/api/logs');
        const textLogs = await resLogs.text();
        const logElement = document.getElementById('log-stream');
        logElement.innerText = textLogs; logElement.scrollTop = logElement.scrollHeight;
    } catch (e) { document.getElementById('log-stream').innerText = "[!] Scouter connection failure. Power core offline."; }
}
function renderScouterChart(used, total) {
    const canvas = document.getElementById('diskChart'); if(!canvas) return;
    const ctx = canvas.getContext('2d'); const pct = used / total;
    ctx.clearRect(0, 0, 200, 200);
    ctx.beginPath(); ctx.arc(100, 100, 75, 0, 2 * Math.PI); ctx.strokeStyle = '#300101'; ctx.lineWidth = 14; ctx.stroke();
    ctx.beginPath(); ctx.arc(100, 100, 75, -0.5 * Math.PI, (-0.5 + 2 * pct) * Math.PI); ctx.strokeStyle = '#ff3333'; ctx.lineWidth = 14; ctx.shadowBlur = 12; ctx.shadowColor = '#ff3333'; ctx.stroke();
    ctx.shadowBlur = 0; ctx.fillStyle = '#ff3333'; ctx.font = 'bold 16px Courier New'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(Math.round(pct * 100) + '% POWER', 100, 100);
}
async function triggerAction(actionName) {
    try {
        await fetch('/api/action', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: actionName }) });
        fetchMetrics();
    } catch (e) { alert("Power link execution failed."); }
}
setInterval(fetchMetrics, 3000); window.onload = fetchMetrics;
</script>
</head><body><div class="grid-960"><div class="card full-width">
<div class="status-bar"><span>CAPSULE CORP UNIT: MAJIN_DECK</span><span>KI SEED: <span id="matrix-seed">0x00</span></span></div>
<h2>[🎛️] Scouter Override Energy Modulators</h2><div class="btn-panel">
<button class="cyber-btn" onclick="triggerAction('automate')">💥 Ignite Ki Charge</button>
<button class="cyber-btn" onclick="triggerAction('probe')">☄️ Scan Power Levels</button></div></div>
<div class="card"><h2>[▶] Active Gravity Chamber Training Stream</h2><pre id="log-stream">Decoding power matrix...</pre>
<div style="font-size:0.7em; color:#ff3333; margin-top:10px; opacity:0.7;">Sync Time: <span id="sys-time">-</span></div></div>
<div class="card"><h2>[📊] Power Reservoirs</h2><div class="chart-box"><canvas id="diskChart" width="200" height="200"></canvas>
<div class="metric-text" id="disk-label">Calculating Ki...</div></div></div></div></body></html>
