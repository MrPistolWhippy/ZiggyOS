name: ZiggyOS Core Compilation Engine Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository Layer
        uses: actions/checkout@v4

      - name: Deploy GNU RISC-V Core Cross-Compiler Toolchains
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-riscv64-unknown-elf binutils-riscv64-unknown-elf

      - name: Execute Asymmetric Bitwise Stream Parser Check
        run: python3 swarm_parser.py

      - name: Execute Bare-Metal 32-Bit RISC-V Machine Compilation Check
        run: |
          # Enforce hardware alignment triplet naming convention rules
          riscv64-unknown-elf-gcc -march=rv32i -mabi=ilp32 -c riscv_watchdog.s -o watchdog.o
          ls -lh watchdog.o

      - name: Execute End-to-End Test Bench Register Verification
        run: |
          riscv64-unknown-elf-gcc -march=rv32i -mabi=ilp32 riscv_driver.c watchdog.o -o riscv_test_bench
          echo "[+] Cloud integration build matches standard verification matrix rules successfully."
