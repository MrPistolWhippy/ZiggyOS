<!DOCTYPE html>
<html>
<head>
    <title>ZIGGYOS V180.0 INTERACTIVE DECK</title>
    <style>
        body { background-color: #000; color: #00ffcc; font-family: 'Courier New', monospace; padding: 20px; }
        .grid-960 { max-width: 960px; margin: 0 auto; }
        .card { border: 1px solid #ff00ff; padding: 15px; margin-bottom: 20px; background: #050505; }
        .teal-mesh { border-color: #00ffcc; }
        h2 { color: #ff00ff; margin-top: 0; text-transform: uppercase; font-size: 1.2em;}
        pre { white-space: pre-wrap; word-wrap: break-word; color: #ffcc00; font-size: 0.9em; line-height: 1.4; max-height: 400px; overflow-y: auto; }
        .status-bar { display: flex; justify-content: space-between; border-bottom: 1px solid #333; padding-bottom: 5px; margin-bottom: 15px; font-size: 0.8em; }
        .btn-panel { display: flex; gap: 15px; margin-bottom: 15px; }
        .cyber-btn { background: #000; color: #00ffcc; border: 1px solid #00ffcc; padding: 10px 15px; font-family: 'Courier New', monospace; cursor: pointer; font-weight: bold; text-transform: uppercase; transition: all 0.2s; }
        .cyber-btn:hover { background: #00ffcc; color: #000; box-shadow: 0 0 10px #00ffcc; }
        .cyber-btn.accent { color: #ff00ff; border-color: #ff00ff; }
        .cyber-btn.accent:hover { background: #ff00ff; color: #000; box-shadow: 0 0 10px #ff00ff; }
    </style>
    <script>
        async function fetchMetrics() {
            try {
                const resStatus = await fetch('/api/status');
                const dataStatus = await resStatus.json();
                document.getElementById('matrix-seed').innerText = dataStatus.entropy_matrix_seed;
                document.getElementById('sys-time').innerText = dataStatus.timestamp;

                const resLogs = await fetch('/api/logs');
                const textLogs = await resLogs.text();
                const logElement = document.getElementById('log-stream');
                logElement.innerText = textLogs;
                // Auto scroll to latest logs
                logElement.scrollTop = logElement.scrollHeight;
            } catch (e) {
                document.getElementById('log-stream').innerText = "[!] Connection block. Ensure API backend server is live.";
            }
        }

        async function triggerAction(actionName) {
            try {
                await fetch('/api/action', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: actionName })
                });
                fetchMetrics(); // Instantly refresh layout after click
            } catch (e) {
                alert("Action execution failed.");
            }
        }

        setInterval(fetchMetrics, 3000);
        window.onload = fetchMetrics;
    </script>
</head>
<body>
    <div class="grid-960">
        <div class="card teal-mesh">
            <div class="status-bar">
                <span>CELL ID: MASTER_DECK</span>
                <span>SEED: <span id="matrix-seed">0x0000</span></span>
            </div>
            <h2>[🎛️] Interactive Cockpit Override Controls</h2>
            <div class="btn-panel">
                <button class="cyber-btn" onclick="triggerAction('automate')">⚡ Run Omni-Automator</button>
                <button class="cyber-btn accent" onclick="triggerAction('probe')">📡 Probe Hardware Driver</button>
            </div>
        </div>

        <div class="card teal-mesh">
            <h2>[▶] Active Telemetry Log Stream Matrix</h2>
            <pre id="log-stream">Connecting to data pool stream...</pre>
            <div style="font-size: 0.7em; color: #666; margin-top: 10px;">
                Last Sync: <span id="sys-time">-</span>
            </div>
        </div>
    </div>
</body>
</html>
